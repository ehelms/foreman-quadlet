---
- name: Validate custom server certificate parameters
  ansible.builtin.fail:
    msg: "When using certificate_source 'custom-server', you must provide --certificate-server-cert, --certificate-server-key, and --certificate-server-ca-cert parameters"
  when:
    - certificate_source == 'custom-server'
    - certificate_server_cert is not defined or certificate_server_key is not defined or certificate_server_ca_cert is not defined

- name: Deploy debug_tools
  ansible.builtin.include_role:
    name: debug_tools

- name: Install podman
  ansible.builtin.package:
    name:
      - podman

- name: Install other dependencies
  ansible.builtin.package:
    name:
      - bash-completion
      - python3-cryptography
      - python3-libsemanage
      - python3-psycopg2
      - python3-requests
